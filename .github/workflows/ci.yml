name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Strict Check & Coverage (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install toolchain dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify zero runtime dependencies invariant
        run: |
          node -e '
            const pkg = require("./package.json");
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error("Zero-dependency invariant violated:", deps);
              process.exit(1);
            }
          '

      - name: TypeScript 100% strict typecheck
        run: npm run typecheck

      - name: Biome static analysis & zero-any lint
        run: npm run lint

      - name: Vitest unit/e2e suite & V8 coverage thresholds
        run: npm run test:coverage

      - name: Build dual ESM/CJS & CLI bundle
        run: npm run build
